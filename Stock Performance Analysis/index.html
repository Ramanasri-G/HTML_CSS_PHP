<!DOCTYPE html>
<html>
<head>
    <title>Stock Performance Analysis</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1> Stock Performance Analysis</h1>
        <p>Financial Data Analysis for Investors</p>
    </div>

    <form action="process.php" method="post">

        <label>Stock Name</label>
        <input type="text" name="stock" placeholder="Enter stock name" required>

        <label>Day 1 Price (₹)</label>
        <input type="number" name="day1" step="0.01" min="0" required>

        <label>Day 2 Price (₹)</label>
        <input type="number" name="day2" step="0.01" min="0" required>

        <label>Day 3 Price (₹)</label>
        <input type="number" name="day3" step="0.01" min="0" required>

        <label>Day 4 Price (₹)</label>
        <input type="number" name="day4" step="0.01" min="0" required>

        <label>Day 5 Price (₹)</label>
        <input type="number" name="day5" step="0.01" min="0" required>

        <button type="submit">Analyze Stock</button>

    </form>

</div>

</body>
</html>
