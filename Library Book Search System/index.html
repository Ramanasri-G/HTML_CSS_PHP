<!DOCTYPE html>
<html>
<head>
    <title>Library Book Search System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Library Book Search</h1>
    <p>Search for Tamil Historical Books</p>

    <form action="process.php" method="post">

        <label>Enter Book Title</label>

        <input type="text"
               name="book_title"
               placeholder="Example: Ponniyin Selvan"
               required>

        <button type="submit">Search Book</button>

    </form>

</div>

</body>
</html>
