<!DOCTYPE html>
<html>

    <title>Sales Trend Analysis</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1> Sales Trend Analysis</h1>
        <p>Historical Sales Performance Report</p>
    </div>

        <input type="number" name="jan" min="0" required>

        <label>March Sales (₹)</label>

        <input type="number" name="apr" min="0" required>

    </form>
