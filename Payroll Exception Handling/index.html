<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll Exception Handling</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Employee Payroll</h1>
    <p class="subtitle">Payroll Calculation & Exception Handling</p>

    <form action="process.php" method="post">

        <label>Employee Name</label>
        <input type="text" name="name" placeholder="Enter employee name" required>

        <label>Basic Salary (₹)</label>
        <input type="number" name="salary" step="0.01"
               placeholder="Enter basic salary" required>

        <label>Working Days</label>
        <input type="number" name="days"
               placeholder="Enter working days" required>

        <label>Bonus (₹)</label>
        <input type="number" name="bonus" step="0.01"
               placeholder="Enter bonus amount" required>

        <label>Deduction (₹)</label>
        <input type="number" name="deduction" step="0.01"
               placeholder="Enter deduction amount" required>

        <button type="submit">Calculate Payroll</button>

    </form>

</div>

</body>
</html>
